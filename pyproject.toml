[tool.poetry]
name = "financial-investment-journey"
version = "0.1.0"
description = "Financial Investment information service"
authors = ["Ylgner Becton <ylgner.becton@gmail.com>"]
license = "LICENSE"
readme = "README.md"
packages = [
  { include = "app" }
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10"
]

[tool.poetry.dependencies]
python = "^3.9"
fastapi = "0.100.0"
grpcio-tools = "1.56.0"
httpx = "0.24.1"
pydantic = "1.10.11"
pytz = "2023.3"
requests = "~=2.31.0"
slowapi = "0.1.8"
uvicorn = "0.22.0"
attrs = "~=23.1.0"
toml = "~=0.10.2"
wheel = "~=0.40.0"
setuptools = "~=68.0.0"
python-dotenv = "1.0.0"
SQLAlchemy = "2.0.19"
PyMySQL = "1.0.2"
alembic = "1.11.1"
bcrypt = "*"
pyjwt = "*"
passlib = "1.7.4"
cryptography = "3.4.8"
python-multipart = "*"

[tool.poetry.dev-dependencies]
freezegun = "*"
ipdb = "*"
ipython = "*"
pre-commit = "*"
flake8 = "6.0.0"
black = "23.7.0"
isort = "5.12.0"
pytest = "*"
pytest-asyncio = "*"
pytest-cov = "*"
pytest-freezegun = "*"
pytest-httpx = "*"
pytest-mock = "3.11.1"

[tool.isort]
profile = "black"
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
line_length = 88

[tool.black]
line_length = 88

[tool.flake8]
max-line-length = 88
extend-ignore = "E203"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
